<style>
  /* Layout: full-screen 3D cut-away skyscraper; HUD is a 56px top bar (portrait) or two slim side columns (wide screens); level map and win card are overlays */
  :root{
    --cream:#FFF6E5; --lip:#E3CFA8; --ink:#2B2B3A; --gold:#FFC93C; --gold-edge:#E59A00; --green:#35C24A; --sky:#7EC8F2;
    --title:'Fredoka','Baloo 2','Trebuchet MS',system-ui,sans-serif; --digits:Verdana,Tahoma,sans-serif;
    --st:env(safe-area-inset-top,0px); --sr:env(safe-area-inset-right,0px); --sb:env(safe-area-inset-bottom,0px); --sl:env(safe-area-inset-left,0px);
    color-scheme: light;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);font-family:var(--title);color:var(--ink);
    touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #safe{position:fixed;visibility:hidden;pointer-events:none;padding:var(--st) var(--sr) var(--sb) var(--sl)}
  button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  .btn{background:var(--cream);box-shadow:0 4px 0 var(--lip),0 6px 10px rgba(0,0,0,.15);border-radius:50%;display:grid;place-items:center}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--lip)}

  /* ---------- home + HUD ---------- */
  #home{position:fixed;top:calc(6px + var(--st));left:calc(10px + var(--sl));z-index:50;
    width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#2a2140;background:rgba(255,255,255,.85);
    box-shadow:0 3px 0 rgba(0,0,0,.18);touch-action:manipulation;-webkit-tap-highlight-color:transparent;text-decoration:none}
  #home svg{width:24px;height:24px}
  #home:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
  #hud{position:fixed;z-index:20;display:flex;align-items:center;justify-content:center;gap:8px;pointer-events:none;
    top:calc(6px + var(--st));left:calc(64px + var(--sl));right:calc(114px + var(--sr));height:44px}
  #prog{display:flex;align-items:center;justify-content:center;gap:2px;min-width:0}
  #progIcons{display:flex;gap:2px;padding:4px 8px;border-radius:14px;background:rgba(255,255,255,.7)}
  .pi{width:14px;height:19px;color:rgba(43,43,58,.25);transition:color .2s}
  .pi svg{width:100%;height:100%;fill:currentColor;display:block}
  .pi.on{color:var(--green);animation:pop .35s ease-out}
  #progBar{position:relative;width:min(100%,220px);min-width:90px;height:28px;border-radius:14px;background:rgba(255,255,255,.75);
    box-shadow:inset 0 0 0 3px #fff;overflow:hidden}
  #progFill{position:absolute;left:0;top:0;bottom:0;width:calc(var(--p,0) * 100%);background:var(--green);transition:width .3s,height .3s}
  #progText{position:relative;display:block;text-align:center;font:bold 15px/28px var(--digits);color:var(--ink)}
  #stairs{display:flex;align-items:center;gap:2px;padding:2px 8px;border-radius:14px;background:rgba(255,255,255,.75);
    font:bold 15px/24px var(--digits);white-space:nowrap}
  #stairs.bump{animation:pop .4s ease-out}
  #hudR{position:fixed;z-index:46;top:calc(6px + var(--st));right:calc(10px + var(--sr));display:flex;gap:10px}
  #hudR .btn{width:44px;height:44px;font-size:22px}
  body.side #hud{top:calc(62px + var(--st));left:calc(10px + var(--sl));right:auto;bottom:calc(10px + var(--sb));width:44px;height:auto;
    flex-direction:column;justify-content:flex-start}
  body.side #progBar{width:44px;min-width:0;height:min(55vh,220px)}
  body.side #progFill{top:auto;right:0;width:auto;height:calc(var(--p,0) * 100%)}
  body.side #progText{font-size:11px;line-height:14px;padding-top:5px;letter-spacing:-.5px}
  body.side #stairs{flex-direction:column;padding:4px 2px;font-size:13px;line-height:16px}
  body.side #hudR{flex-direction:column}

  /* ---------- feedback: ripple, hint hand, edge arrows ---------- */
  #fx{position:fixed;inset:0;pointer-events:none;z-index:15;overflow:hidden}
  .ripple{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;border:4px solid #fff;border-radius:50%;
    animation:rip .5s ease-out forwards;box-shadow:0 0 6px rgba(0,0,0,.25)}
  @keyframes rip{to{transform:scale(4);opacity:0}}
  #hand{position:fixed;z-index:16;font-size:54px;line-height:1;pointer-events:none;margin:0 0 0 -18px;
    filter:drop-shadow(0 3px 3px rgba(0,0,0,.35));animation:hand 1s ease-in-out infinite}
  @keyframes hand{50%{transform:translateY(12px) scale(1.12)}}
  .edge{position:fixed;z-index:18;width:64px;height:52px;margin-left:-32px;border-radius:26px;font-size:24px;display:flex;
    align-items:center;justify-content:center;gap:0;background:rgba(255,255,255,.88);box-shadow:0 4px 0 var(--lip)}
  .edge b{font-size:14px;color:var(--ink)}
  .edge.angry{animation:pulse .6s ease-in-out infinite;background:#FFD2CC}
  @keyframes pulse{50%{transform:scale(1.15)}}
  @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.45)}100%{transform:scale(1)}}

  /* ---------- level map ---------- */
  #map{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    padding:calc(60px + var(--st)) calc(12px + var(--sr)) calc(12px + var(--sb)) calc(12px + var(--sl));
    background:linear-gradient(rgba(126,200,242,.55),rgba(255,231,199,.6))}
  #map h1{margin:0;font-family:var(--title);font-weight:700;font-size:clamp(40px,11vmin,72px);color:#fff;letter-spacing:1px;
    text-shadow:0 4px 0 #2f6fe0,0 6px 14px rgba(0,0,0,.25);-webkit-text-stroke:2px #2f6fe0}
  #mapLeft{display:flex;flex-direction:column;align-items:center;gap:14px}
  #play{width:clamp(96px,24vmin,130px);height:clamp(96px,24vmin,130px);background:var(--green);box-shadow:0 7px 0 #24852f,0 0 0 8px rgba(255,255,255,.6);
    animation:pulse 1.3s ease-in-out infinite}
  #play svg{width:46%;height:46%;margin-left:8%}
  #levels{display:grid;grid-template-columns:repeat(2,var(--lb));grid-template-rows:repeat(5,var(--lb));gap:10px;padding:12px;
    border-radius:18px;background:rgba(242,168,139,.85);box-shadow:0 0 0 5px #fff6e5;
    --lb:clamp(48px,min(72px,calc((100vh - 360px) / 5 - 10px)),72px)}
  .lv{width:var(--lb);height:var(--lb);border-radius:14px;background:var(--cream);box-shadow:0 4px 0 var(--lip);display:flex;flex-direction:column;
    align-items:center;justify-content:center;font:bold calc(var(--lb) * .36)/1 var(--digits);color:var(--ink)}
  .lv:active{transform:translateY(3px);box-shadow:0 1px 0 var(--lip)}
  .lv small{font-size:calc(var(--lb) * .2);letter-spacing:-1px;margin-top:3px;color:#c9b9a0}
  .lv small i{font-style:normal;color:var(--gold);text-shadow:0 1px 0 var(--gold-edge)}
  .lv.locked{opacity:.55;font-size:calc(var(--lb) * .34)}
  body.side #map{flex-direction:row;gap:28px;padding-top:calc(12px + var(--st))}
  body.side #levels{--lb:clamp(40px,calc((100vh - 90px) / 5 - 10px),66px)}

  /* ---------- win card ---------- */
  #win{position:fixed;inset:0;z-index:45;display:grid;place-items:center;background:rgba(43,43,58,.25)}
  #card{display:flex;flex-direction:column;align-items:center;gap:16px;padding:22px 26px;border-radius:28px;background:var(--cream);
    box-shadow:0 8px 0 var(--lip),0 14px 30px rgba(0,0,0,.25);animation:cardIn .4s ease-out}
  @keyframes cardIn{from{transform:scale(.6);opacity:0}}
  #starRow{display:flex;gap:8px}
  .star{font-size:clamp(52px,15vmin,84px);line-height:1;color:#ddd3c2;transform:scale(0)}
  .star.on{color:var(--gold);text-shadow:0 4px 0 var(--gold-edge)}
  .star.show{animation:starIn .45s cubic-bezier(.3,1.6,.5,1) forwards}
  @keyframes starIn{to{transform:scale(1)}}
  #cardBtns{display:flex;gap:14px}
  #cardBtns .btn{width:64px;height:64px;font-size:30px}
  #bNext{background:var(--green)!important;box-shadow:0 4px 0 #24852f!important}
  .conf{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall 2.6s linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>

<script type="module">
/* ======== imports ======== */
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ======== tuning ======== */
const FIXED_DT = 1 / 60;          // simulation step (s)
const CAR_SPEED = 5.5;            // lift top speed (units/s, a floor is 3 units)
const CAR_ACCEL = 9;              // lift acceleration and braking (units/s²)
const DOOR_TIME = 0.45;           // doors opening or closing (s)
const DWELL_MIN = 0.9;            // doors stay open at least this long (s)
const BOARD_GAP = 0.3;            // gap between two people stepping into a car (s)
const WALK_SPEED = 1.6;           // people walking (units/s)
const QUEUE_MAX = 5;              // people waiting on one floor at most
const MAX_PEOPLE = 30;            // people in the building at most
const RIDE_PATIENCE_RATE = 0.3;   // patience runs out this much slower inside a car
const MOOD_T = [0.35, 0.6, 0.8, 1.0];  // wait/patience thresholds: happy, ok, grumpy, angry, then the stairs
const HINT_DELAY_L1 = 2;          // idle seconds before the hand hint shows on level 1
const HINT_DELAY = 8;             // same on later levels
const MIN_FLOOR_PX = 64;          // a floor is never drawn shorter than this; taller buildings pan
const CELEBRATE_TIME = 1.2;       // delivered people cheer this long (s)
const FAST_MULT = 4;              // ?fast speed-up
const SPECIAL_CHANCE = 0.12;      // chance per arrival of each unlocked special person
const ARRIVE_JITTER = 0.3;        // ±30% on the arrival interval
const TRIP_MIX = [0.40, 0.35];    // lobby -> up, up -> lobby; the rest go between upper floors
const FIRST_ARRIVAL = 1.0;        // first person appears after this (s)
const BOT_EVERY = 0.7;            // ?demo bot taps this often (s)
const WIN_DELAY = 0.9;            // pause before the win card (s)
const CAM_FOV = 30, CAM_YAW = 6, CAM_PITCH = 4;   // degrees
const TOP_BAR = 56, SIDE_COL = 64, SIDE_RATIO = 1.3;  // HUD sizes (px); wider than 1.3:1 uses side columns
const VIEW_BOTTOM = 0.8, VIEW_TOP = 1.8;  // world margin shown below the lobby / above the top floor (roof)
const BUBBLE_PX = 44;             // target on-screen size of a floor bubble (px)
const RIDER_BUBBLE = 0.7;         // bubbles of people inside a car are this much smaller (they stand close)

const params = new URLSearchParams(location.search);
const DEMO = params.has('demo');
const TICK = DEMO || params.has('tick');   // tick from a timer as well as animation frames (headless tests)
const FAST = params.has('fast');
const FORCE_MUTE = params.has('mute');
const SPEED = FAST ? FAST_MULT : 1;
const DEG = Math.PI / 180;

/* ======== levels & themes data ======== */
const RUSH = { kind: 'rush', every: 45, n: 5 };    // 5 people at the lobby at once
const LUNCH = { kind: 'lunch', every: 50, n: 5 };  // 5 people heading to the café
const SP1 = ['grandma'], SP2 = ['grandma', 'courier'], SP3 = ['grandma', 'courier', 'dogwalker'];
const LEVELS = [
  { floors: 3, cars: 1, cap: 4, every: 7.0, patience: 45, target: 5,  specials: [],  waves: [] },
  { floors: 4, cars: 1, cap: 4, every: 6.0, patience: 40, target: 8,  specials: [],  waves: [] },
  { floors: 5, cars: 1, cap: 4, every: 5.5, patience: 36, target: 10, specials: SP1, waves: [] },
  { floors: 5, cars: 2, cap: 4, every: 5.0, patience: 31, target: 12, specials: SP1, waves: [] },
  { floors: 6, cars: 2, cap: 4, every: 4.5, patience: 30, target: 14, specials: SP2, waves: [] },
  { floors: 6, cars: 2, cap: 3, every: 4.2, patience: 32, target: 15, specials: SP3, waves: [] },
  { floors: 7, cars: 2, cap: 4, every: 4.4, patience: 32, target: 15, specials: SP3, waves: [RUSH] },
  { floors: 7, cars: 3, cap: 4, every: 3.6, patience: 30, target: 18, specials: SP3, waves: [] },
  { floors: 8, cars: 3, cap: 5, every: 3.2, patience: 28, target: 20, specials: SP3, waves: [LUNCH] },
  { floors: 8, cars: 3, cap: 5, every: 3.0, patience: 26, target: 24, specials: SP3, waves: [RUSH, LUNCH] },
];
const KINDS = {
  adult:     { walk: 1.0, patience: 1.0, seats: 1, move: 'walk' },
  kid:       { walk: 1.0, patience: 1.0, seats: 1, move: 'walk' },
  grandma:   { walk: 0.5, patience: 1.5, seats: 1, move: 'walk' },
  courier:   { walk: 1.4, patience: 0.6, seats: 1, move: 'run' },
  dogwalker: { walk: 1.0, patience: 1.0, seats: 2, move: 'walk' },
};
const NUMBER_WORDS = ['One!', 'Two!', 'Three!', 'Four!', 'Five!', 'Six!', 'Seven!', 'Eight!'];
const MOOD_FACES = ['😀', '🙂', '😐', '😠'];

/* ======== art ======== */
// Toy-clay art for "Going Up!" (graphics designer). API: PLAN.md section 6, notes in EXTENSIONS.md.
// Static props are merged per floor and material, coloured with vertex colours, so a floor costs ~12 draw calls.
// Internal helpers are prefixed `art`. Deterministic: every random look comes from artRng(seed).
const ART = {
  FLOOR_H: 3.0, SLAB: 0.3, DEPTH: 4.5, ROOM_W: 6.4, SHAFT_W: 2.2,
  LANE_Z: -0.8,                 // people walk/queue here
  CAR_W: 1.8, CAR_H: 2.4, CAR_D: 2.2, CAR_Z: -2.4,   // car box centre z; front face at CAR_Z + CAR_D/2 = -1.3
  MAX_CAP: 6,                   // riderSpots length
  BUBBLE_Y: 0.55,               // bubble centre above person height
  BUBBLE_SIZE: 1.25,            // sprite world size (square)
};
const FLOOR_THEMES = [
  { id: 'lobby',   name: 'Lobby',      color: '#FFC928', icon: '🛎️' },
  { id: 'cafe',    name: 'Café',       color: '#E8413A', icon: '☕' },
  { id: 'library', name: 'Library',    color: '#2F6FE0', icon: '📚' },
  { id: 'play',    name: 'Playroom',   color: '#FF8A1F', icon: '🧸' },
  { id: 'pool',    name: 'Pool',       color: '#19C2D6', icon: '🏊' },
  { id: 'music',   name: 'Music room', color: '#9A55E6', icon: '🎵' },
  { id: 'garden',  name: 'Greenhouse', color: '#35C24A', icon: '🌻' },
  { id: 'stars',   name: 'Star dome',  color: '#FF5FAE', icon: '🔭' },
];

/* -------- art: palette & shared state -------- */
const ART_WALL_T = 0.36;                       // side wall thickness
const ART_SUN_DIR = new THREE.Vector3(-6, 14, 10).normalize();
const ART_CAR_COLORS = ['#E8473F', '#2F8FE0', '#2FB37A'];
const ART_SKINS = ['#FFE0C4', '#F6C9A0', '#E0A878', '#C68A5A', '#9C6440', '#6E4228'];
const ART_HAIRS = ['#2B1E16', '#5A3825', '#C8782E', '#E8C468', '#3A3A48'];
const ART_CLOTHES = ['#FF7A7A', '#FFB347', '#7FD1B9', '#6FA8FF', '#B68CFF', '#FF9ECF', '#F4F4F4', '#8BC34A', '#FFDD57'];
const ART_PANTS = ['#3B4A6B', '#55657F', '#7A5A44', '#4A4A5A', '#2F6FA8'];
const ART_TOYS = ['#FF7A7A', '#FFB347', '#FFDD57', '#8BC34A', '#6FA8FF', '#B68CFF', '#FF9ECF', '#7FD1B9'];
const ART_CREAM = '#FFF6E5', ART_CUT_DARK = '#EAD9BE', ART_FACADE = '#F2A88B', ART_FACADE_SHADE = '#E58F73';
const ART_BRASS = '#D9A93F', ART_CHROME = '#E3E8EE';
const ART_RED_TINT = new THREE.Color('#FF6655');
const ART_WHITE = new THREE.Color('#ffffff');
let artNow = 0;
const artLive = new Set();          // things animateArt ticks: { tick(t, dt) }

function artRng(seed) {
  let a = (seed >>> 0) || 1;
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const artPick = (r, arr) => arr[Math.floor(r() * arr.length) % arr.length];
function artMixHex(a, b, k) {     // sRGB mix of two '#rrggbb' colours
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const ch = (s) => Math.round(((pa >> s) & 255) * (1 - k) + ((pb >> s) & 255) * k);
  return '#' + ((1 << 24) | (ch(16) << 16) | (ch(8) << 8) | ch(0)).toString(16).slice(1);
}
const artTint = (hex) => artMixHex(hex, '#ffffff', 0.62);      // floor wall tint

/* -------- art: geometry & material caches -------- */
const artGeoCache = new Map();
function artGeo(key, make) { let g = artGeoCache.get(key); if (!g) { g = make(); artGeoCache.set(key, g); } return g; }
function artRB(w, h, d, r = 0.06, s = 2) {
  const rr = Math.min(r, Math.min(w, h, d) * 0.49);
  return artGeo(`rb|${w}|${h}|${d}|${rr}|${s}`, () => new RoundedBoxGeometry(w, h, d, s, rr));
}
const artBox = (w, h, d) => artGeo(`bx|${w}|${h}|${d}`, () => new THREE.BoxGeometry(w, h, d));
const artSph = (r, ws = 12, hs = 8, ps = 0, pl = Math.PI * 2, ts = 0, tl = Math.PI) =>
  artGeo(`sp|${r}|${ws}|${hs}|${ps}|${pl}|${ts}|${tl}`, () => new THREE.SphereGeometry(r, ws, hs, ps, pl, ts, tl));
const artCyl = (rt, rb, h, s = 14, open = false, ts = 0, tl = Math.PI * 2) =>

/* ======== art: lights ======== */
function buildLights(scene, renderer) {
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.95;
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  // tiny gradient environment so brass and glass catch a soft sky reflection
  const envScene = new THREE.Scene(), eg = new THREE.SphereGeometry(10, 24, 12), pos = eg.attributes.position, cols = [];
  const top = new THREE.Color('#BFE3FF'), mid = new THREE.Color('#FFF3E0'), bot = new THREE.Color('#D8B890'), c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) { const y = pos.getY(i) / 10; c.copy(mid).lerp(y > 0 ? top : bot, Math.abs(y)); cols.push(c.r, c.g, c.b); }
  eg.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  envScene.add(new THREE.Mesh(eg, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(envScene, 0.04).texture; pm.dispose(); eg.dispose();
  scene.add(new THREE.HemisphereLight('#CFE8FF', '#F3D9B8', 0.47));
  const sun = new THREE.DirectionalLight('#FFE2B8', 2.3);
  sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024); sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.02;
  scene.add(sun); scene.add(sun.target);
  const rim = new THREE.DirectionalLight('#BFD9FF', 0.4); rim.position.set(12, 10, -10); scene.add(rim);
  const v = new THREE.Vector3(), rot = new THREE.Matrix4(), up = new THREE.Vector3(0, 1, 0);
  const fit = (layout) => {
    const H = layout.height + 4, cz = -ART.DEPTH / 2, ctr = new THREE.Vector3(0, H / 2, cz);
    sun.target.position.copy(ctr); sun.position.copy(ctr).addScaledVector(ART_SUN_DIR, 50);
    sun.updateMatrixWorld(); sun.target.updateMatrixWorld();
    rot.lookAt(sun.position, ctr, up).transpose();
    let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9, z0 = 1e9, z1 = -1e9;
    for (const x of [layout.x0 - 1, layout.x1 + 1]) for (const y of [-0.5, H]) for (const z of [-ART.DEPTH - 0.8, 0.8]) {
      v.set(x, y, z).sub(sun.position).applyMatrix4(rot);
      x0 = Math.min(x0, v.x); x1 = Math.max(x1, v.x); y0 = Math.min(y0, v.y); y1 = Math.max(y1, v.y); z0 = Math.min(z0, v.z); z1 = Math.max(z1, v.z);
    }
    const cam = sun.shadow.camera;
    cam.left = x0; cam.right = x1; cam.bottom = y0; cam.top = y1; cam.near = Math.max(0.1, -z1 - 2); cam.far = -z0 + 2;
    cam.updateProjectionMatrix();
  };
  return { sun, fit };
}

  const clay = artClay(), shiny = artShiny(), glow = artGlow(), glass = artGlass();
  const SB = new ArtBatch();                                   // shell batch
  const sput = (geo, hex, x, y, z, rx = 0, ry = 0, rz = 0, sx = 1, sy = sx, sz = sx, mat = clay) => SB.add(geo, mat, artXf(x, y, z, rx, ry, rz, sx, sy, sz), hex);
  const STAIR_W = 1.45, HOLE_Z = -3.1;
  const sx0 = x0 + RW;                                          // first shaft's left edge

  // ---- slabs (k = 0 ground .. nFloors roof): one front strip (the cream "cake" cut) + back pieces
  for (let k = 0; k <= nFloors; k++) {
    const y = k * FH - SL / 2, mid = k > 0 && k < nFloors, w = x1 - x0;
    sput(artRB(w, SL, 1.2, 0.07), ART_CREAM, (x0 + x1) / 2, y, -0.6);
    sput(artBox(w - 0.1, 0.05, 0.02), ART_CUT_DARK, (x0 + x1) / 2, k * FH - SL + 0.04, 0.005);
    sput(artRB(RW - STAIR_W, SL, D - 1.2, 0.05), ART_CREAM, x0 + STAIR_W + (RW - STAIR_W) / 2, y, -1.2 - (D - 1.2) / 2);
    const sd = mid ? -HOLE_Z - 1.2 : D - 1.2;
    sput(artRB(STAIR_W, SL, sd, 0.05), ART_CREAM, x0 + STAIR_W / 2, y, -1.2 - sd / 2);
    if (!mid) sput(artRB(nShafts * SW, SL, D - 1.2, 0.05), ART_CREAM, sx0 + nShafts * SW / 2, y, -1.2 - (D - 1.2) / 2);
    if (k < nFloors) {                                           // accent lip on the cut edge, in the floor's colour

    sput(artRB(ART_WALL_T - 0.06, top + SL, D + ART_WALL_T, 0.05), ART_CREAM, xi + side * (ART_WALL_T - 0.06) / 2, (top - SL) / 2, -(D + ART_WALL_T) / 2);

function makeRng(seed) {   // mulberry32, the game's own seeded random numbers
  let a = (seed >>> 0) || 1;
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
let rng = makeRng(Number.isFinite(seedParam) ? seedParam : (Date.now() & 0x7fffffff));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rint = (n) => Math.floor(rng() * n);

function setupLevel(i) {
  for (const p of G.people) p.art.dispose();
  for (const c of G.cars) c.art.dispose();
  building?.dispose();
  G.levelIdx = i; G.level = LEVELS[i];
  const L = G.layout = computeLayout(G.level.floors, G.level.cars);
  building = buildBuilding(scene, L); lights.fit(L);
  G.time = 0; G.delivered = 0; G.leftStairs = 0; G.spawnTimer = FIRST_ARRIVAL; G.firstDone = false; G.botT = 1;
  G.waveTimers = G.level.waves.map((w) => w.every * 0.5);
  G.people = []; G.lastInputTime = 0; G.cardShown = false; G.resumable = false; G.glow = new Array(L.nFloors).fill(0);
  G.floors = L.floorY.map(() => ({ queue: [], stairHold: 0, roomHold: 0, stairOpen: 0, roomOpen: 0 }));
  G.cars = L.shaftX.map((x, s) => {
    const art = buildCar(s, G.level.cap); scene.add(art.group);
    return { idx: s, y: 0, v: 0, target: null, queuedTarget: null, door: 0, doorState: 'closed', dwell: 0, boardGap: 0,
      fullFlashed: false, riders: [], spots: new Array(ART.MAX_CAP).fill(null), seatsUsed: 0, cap: G.level.cap, art,
      shownTarget: undefined, shownDir: 0 };
  });
  view.camY = -1e9; view.camVY = 0; view.goalY = null;
  fitCamera();
  view.camY = view.yMin;
  renderProgress(); updateStairs();
}

function startLevel(i) {
  i = clamp(i | 0, 0, LEVELS.length - 1);
  setupLevel(i);
  starTimers.forEach(clearTimeout); starTimers.length = 0;
  document.getElementById('fx').innerHTML = '';
  G.phase = 'play';
  document.getElementById('map').hidden = true;
  document.getElementById('mapBtn').hidden = false;
  document.getElementById('win').hidden = true;
  document.getElementById('hud').hidden = false;
  speak('Going up!');
}

/* ======== people ======== */
function pickKind() {
  for (const k of G.level.specials) if (rng() < SPECIAL_CHANCE) return k;
  return rng() < 0.35 ? 'kid' : 'adult';
}

function spawnPerson(origin, dest, kind) {
  if (G.people.length >= MAX_PEOPLE) return null;
  const q = G.floors[origin].queue; if (q.length >= QUEUE_MAX) return null;
  kind = kind || pickKind();
  const K = KINDS[kind], seed = 1 + rint(1e9);
  const art = buildPerson(kind, seed); scene.add(art.group);
  const L = G.layout;
  const p = { id: G.nextId++, kind, seed, floor: origin, dest, x: L.roomDoorX, z: L.laneZ, rot: Math.PI / 2, state: 'arriving',
    waited: 0, stage: 0, seats: K.seats, carIdx: -1, spots: [], patience: G.level.patience * K.patience, speed: WALK_SPEED * K.walk,
    move: K.move, art, alpha: 0, fade: 1, anim: 'walk', animT: 0, shakeT: 0, phase: 0, timer: 0, shownAlpha: -1 };
  art.setBubble(dest); art.setMood(0, 0); art.setOpacity(0);
  q.push(p); G.people.push(p);
  G.floors[origin].roomHold = 0.7;
  return p;
}

function upper() { return 1 + rint(G.layout.nFloors - 1); }
function spawnRandom() {
  const n = G.layout.nFloors;
  if (!G.firstDone) { G.firstDone = true; spawnPerson(0, upper(), rng() < 0.5 ? 'adult' : 'kid'); return; }
  for (let tries = 0; tries < 6; tries++) {
    const r = rng(); let o, d;
    if (r < TRIP_MIX[0]) { o = 0; d = upper(); }
    else if (r < TRIP_MIX[0] + TRIP_MIX[1] || n < 3) { o = upper(); d = 0; }
    else { o = upper(); do { d = upper(); } while (d === o); }
    if (G.floors[o].queue.length < QUEUE_MAX) { spawnPerson(o, d); return; }
  }
}

function runWave(w) {
  if (w.kind === 'rush') { for (let k = 0; k < w.n; k++) spawnPerson(0, upper()); }
  else { let made = 0; for (let t = 0; t < w.n * 3 && made < w.n; t++) { let o = rint(G.layout.nFloors); if (o === 1) continue; if (spawnPerson(o, 1)) made++; } }
}

function setAnim(p, name) { if (p.anim !== name) { p.anim = name; p.animT = 0; } }

function walkTo(p, tx, tz, dt, anim) {
  const dx = tx - p.x, dz = tz - p.z, dist = Math.hypot(dx, dz);
  if (dist < 0.02) { p.x = tx; p.z = tz; return true; }
  const step = Math.min(dist, p.speed * dt);
  p.x += dx / dist * step; p.z += dz / dist * step;
  if (Math.abs(dx) > Math.abs(dz)) p.rot = dx > 0 ? Math.PI / 2 : -Math.PI / 2; else p.rot = dz < 0 ? Math.PI : 0;
  setAnim(p, anim || p.move);
  return false;
}

function moodStage(m) { let s = 0; while (s < MOOD_T.length && m >= MOOD_T[s]) s++; return s; }

function startLeaving(p) {
  const q = G.floors[p.floor].queue; const i = q.indexOf(p); if (i >= 0) q.splice(i, 1);
  p.state = 'leavingStairs'; p.art.setBubble(null); p.speed = WALK_SPEED * 1.15;
  G.leftStairs++; updateStairs(true); sfx('stomp');
}

function boardPerson(p, c) {
  const q = G.floors[p.floor].queue; const i = q.indexOf(p); if (i >= 0) q.splice(i, 1);
  p.state = 'boarding'; p.carIdx = c.idx; p.phase = 0; p.spots = [];
  for (let k = 0; k < c.cap && p.spots.length < p.seats; k++) if (!c.spots[k]) p.spots.push(k);
  p.spots.forEach((k) => { c.spots[k] = p; });
  c.seatsUsed += p.seats; c.art.setLoad(c.seatsUsed, c.cap);
}

function exitPerson(p, c, f) {
  c.riders.splice(c.riders.indexOf(p), 1);
  p.spots.forEach((k) => { c.spots[k] = null; }); p.spots = [];
  c.seatsUsed -= p.seats; c.art.setLoad(c.seatsUsed, c.cap);
  const g = p.art.group; const local = g.position.clone();
  c.art.group.remove(g); scene.add(g);
  p.x = G.layout.shaftX[c.idx] + local.x; p.z = ART.CAR_Z + local.z; p.floor = f;
  p.state = 'exiting';
}

function removePerson(p) {
  p.art.dispose(); p.removed = true;
  const i = G.people.indexOf(p); if (i >= 0) G.people.splice(i, 1);
}

function updatePerson(p, dt) {
  const L = G.layout, fl = G.floors[p.floor];
  p.animT += dt;
  if (p.alpha < p.fade) p.alpha = Math.min(p.fade, p.alpha + dt / 0.3);
  if (p.alpha > p.fade) p.alpha = Math.max(p.fade, p.alpha - dt / 0.35);
  if (G.phase === 'play' && (p.state === 'arriving' || p.state === 'waiting' || p.state === 'boarding' || p.state === 'riding')) {
    const inCar = p.state === 'boarding' || p.state === 'riding';
    p.waited += dt * (inCar ? RIDE_PATIENCE_RATE : 1);
    const m = p.waited / p.patience;
    let st = moodStage(m); if (inCar) st = Math.min(st, 2);
    if (st !== p.stage) { if (st === 3) sfx('grumble'); p.stage = st; }
    p.art.setMood(Math.min(st, 3), clamp(m, 0, 1));
    if (st >= 4 && !inCar) { startLeaving(p); return; }
  }
  switch (p.state) {
    case 'arriving': case 'waiting': {
      const slot = Math.max(0, fl.queue.indexOf(p));
      if (walkTo(p, L.queueX[Math.min(slot, L.queueX.length - 1)], L.laneZ, dt)) {
        p.state = 'waiting'; p.rot = 0;
        if (p.shakeT > 0) { p.shakeT -= dt; setAnim(p, 'shake'); } else setAnim(p, 'idle');
      }
      break;
    }
    case 'boarding': {
      const c = G.cars[p.carIdx], sx = L.shaftX[c.idx], spot = c.art.riderSpots[p.spots[0]];
      if (p.phase === 0) { if (walkTo(p, sx, L.laneZ, dt)) p.phase = 1; }
      else if (walkTo(p, sx + spot.x, ART.CAR_Z + spot.z, dt)) {
        const g = p.art.group; scene.remove(g); c.art.group.add(g);
        g.position.copy(spot); g.rotation.y = 0; p.rot = 0;
        p.state = 'riding'; c.riders.push(p); setAnim(p, 'idle');
      }
      break;
    }
    case 'riding': setAnim(p, 'idle'); break;
    case 'exiting':
      if (walkTo(p, p.x, L.laneZ, dt)) {
        p.state = 'celebrating'; p.carIdx = -1; p.timer = CELEBRATE_TIME; p.rot = 0;
        p.art.setBubble(null); p.art.setMood(0, 0); setAnim(p, 'cheer');
        G.delivered++; sfx('chirp'); renderProgress(true); checkWin();
      }
      break;
    case 'celebrating':
      p.timer -= dt; if (p.timer <= 0) p.state = 'toDoor';
      break;
    case 'toDoor':
      if (walkTo(p, L.roomDoorX, L.laneZ + 0.35, dt)) { fl.roomHold = 0.6; p.fade = 0; setAnim(p, 'idle'); if (p.alpha <= 0) removePerson(p); }
      break;
    case 'leavingStairs':
      if (walkTo(p, L.stairX, L.laneZ + 0.35, dt, 'stomp')) { fl.stairHold = 0.6; p.fade = 0; setAnim(p, 'idle'); if (p.alpha <= 0) removePerson(p); }
      break;
  }
}

/* ======== cars ======== */
function carFloorAt(c) {
  if (c.v !== 0) return -1;
  const f = Math.round(c.y / ART.FLOOR_H);
  return Math.abs(c.y - f * ART.FLOOR_H) < 0.02 ? f : -1;
}

function openDoors(c) { c.doorState = 'opening'; sfx('doorOpen'); }

function arrive(c, f) {
  if (c.target === f) c.target = null;
  sfx('ding'); openDoors(c);
  if (c.riders.some((p) => p.dest === f)) speak(NUMBER_WORDS[f]);
}

function moveCar(c, dt) {
  const FH = ART.FLOOR_H;
  if (c.target == null) {
    const f = carFloorAt(c);
    if (f >= 0 && G.phase === 'play') {
      if (G.floors[f].queue.some((p) => p.state === 'waiting' && c.seatsUsed + p.seats <= c.cap)) openDoors(c);
    }
    return;
  }
  const goal = c.target * FH;
  if (c.v === 0 && Math.abs(c.y - goal) < 0.02) { c.y = goal; arrive(c, c.target); return; }
  const dir = Math.sign(goal - c.y);
  let stopY = goal;
  if (c.v === 0 || Math.sign(c.v) === dir) {
    const brake = c.v * c.v / (2 * CAR_ACCEL);
    for (const p of c.riders) {
      const dy = p.dest * FH, ahead = (dy - c.y) * dir;
      if (ahead > 0.01 && ahead < (stopY - c.y) * dir && ahead >= brake - 0.05) stopY = dy;
    }
  }
  const d = stopY - c.y, sd = Math.sign(d);
  const want = sd * Math.min(CAR_SPEED, Math.sqrt(2 * CAR_ACCEL * Math.abs(d)));
  c.v += clamp(want - c.v, -CAR_ACCEL * dt, CAR_ACCEL * dt);
  const step = c.v * dt;
  if ((Math.abs(d) < 0.003 || (Math.sign(step) === sd && Math.abs(step) >= Math.abs(d))) && Math.abs(c.v) < 2) {
    c.y = stopY; c.v = 0; arrive(c, Math.round(stopY / FH)); return;
  }
  c.y += step;
}

function updateCar(c, dt) {
  switch (c.doorState) {
    case 'opening':
      c.door = Math.min(1, c.door + dt / DOOR_TIME);
      if (c.door >= 1) {
        c.doorState = 'open'; c.dwell = 0; c.boardGap = 0.15; c.fullFlashed = false;
        const f = carFloorAt(c);
        for (const p of [...c.riders]) if (p.dest === f) exitPerson(p, c, f);
      }
      break;
    case 'open': {
      c.dwell += dt; c.boardGap -= dt;
      const f = carFloorAt(c);
      let exiting = false, busy = false;
      for (const p of G.people) if (p.carIdx === c.idx) {
        if (p.state === 'exiting') exiting = busy = true; else if (p.state === 'boarding') busy = true;
      }
      const q = G.floors[f].queue, front = q[0];
      let canBoard = false;
      if (!exiting && front && front.state === 'waiting' && G.phase !== 'won') {
        const fits = q.find((p) => p.state === 'waiting' && c.seatsUsed + p.seats <= c.cap);
        if (fits) {
          canBoard = true;
          if (c.boardGap <= 0) { boardPerson(fits, c); c.boardGap = BOARD_GAP; }
        } else if (!c.fullFlashed && c.seatsUsed >= c.cap) { c.fullFlashed = true; c.art.flashFull(); sfx('full'); front.shakeT = 1.2; }
      }
      if (!busy && !canBoard && c.dwell >= DWELL_MIN) { c.doorState = 'closing'; sfx('doorClose'); }
      break;
    }
    case 'closing':
      c.door = Math.max(0, c.door - dt / DOOR_TIME);
      if (c.door <= 0) { c.doorState = 'closed'; if (c.queuedTarget != null) { c.target = c.queuedTarget; c.queuedTarget = null; } }
      break;
    case 'closed': moveCar(c, dt); break;
  }
}

function tap(ci, floor) {
  const c = G.cars[ci]; if (!c || G.phase !== 'play') return;
  floor = clamp(floor | 0, 0, G.layout.nFloors - 1);
  sfx('tap'); G.glow[floor] = 0.45;
  if (c.doorState === 'closed') { c.target = floor; c.queuedTarget = null; }
  else if (carFloorAt(c) === floor && c.doorState !== 'closing') { /* already here with doors open: keep any queued trip */ }
  else c.queuedTarget = floor;
}

function nearestCar(floor) {
  const y = floor * ART.FLOOR_H;
  let best = -1, bd = Infinity;
  for (const pass of [0, 1, 2]) {   // 0: closed and empty, 1: closed, 2: any
    for (const c of G.cars) {
      if (pass < 2 && c.doorState !== 'closed') continue;
      if (pass === 0 && c.riders.length) continue;
      const d = Math.abs(c.y - y); if (d < bd) { bd = d; best = c.idx; }
    }
    if (best >= 0) return best;
  }
  return 0;
}

/* ======== simulation ======== */
function simStep(dt) {
  G.time += dt;
  if (G.phase === 'play') {
    G.spawnTimer -= dt;
    if (G.spawnTimer <= 0) { G.spawnTimer = G.level.every * (1 + (rng() * 2 - 1) * ARRIVE_JITTER); spawnRandom(); }
    G.level.waves.forEach((w, i) => { G.waveTimers[i] -= dt; if (G.waveTimers[i] <= 0) { G.waveTimers[i] = w.every; runWave(w); } });
    if (DEMO) { G.botT -= dt; if (G.botT <= 0) { G.botT = BOT_EVERY; const m = suggestMove(); if (m) tap(m.car, m.floor); } }
  }
  for (const c of G.cars) updateCar(c, dt);
  for (const p of [...G.people]) if (!p.removed) updatePerson(p, dt);
  for (const f of G.floors) {
    f.stairHold -= dt; f.roomHold -= dt;
    f.stairOpen = clamp(f.stairOpen + (f.stairHold > 0 ? dt : -dt) * 4, 0, 1);
    f.roomOpen = clamp(f.roomOpen + (f.roomHold > 0 ? dt : -dt) * 4, 0, 1);
  }
  for (let i = 0; i < G.glow.length; i++) if (G.glow[i] > 0) G.glow[i] -= dt;
  if (G.phase === 'won' && !G.cardShown && G.time - G.wonAt >= WIN_DELAY) showWinCard();
}

function checkWin() {
  if (G.phase !== 'play' || G.delivered < G.level.target) return;
  G.phase = 'won'; G.wonAt = G.time;
  G.stars = G.leftStairs === 0 ? 3 : G.leftStairs <= 2 ? 2 : 1;
  saveStars(G.levelIdx, G.stars);
}

/* ======== input ======== */
let drag = null;                 // the pointer currently panning (or the last one pressed)
const ptrs = new Map();          // every finger/mouse by pointerId, so a second finger doesn't drop the first tap
const DRAG_PX = 12;              // a move further than this is a swipe, never a tap
canvas.addEventListener('pointerdown', (e) => {
  const d = { id: e.pointerId, x: e.clientX, y: e.clientY, lastY: e.clientY, lastT: performance.now(), moved: false };
  ptrs.set(e.pointerId, d); if (!(drag && drag.moved)) drag = d;
  view.camVY = 0;
  try { canvas.setPointerCapture(e.pointerId); } catch {}
});
canvas.addEventListener('pointermove', (e) => {
  const d = ptrs.get(e.pointerId); if (!d) return;
  if (!d.moved && Math.hypot(e.clientX - d.x, e.clientY - d.y) > DRAG_PX) { d.moved = true; if (!(drag && drag.moved && drag !== d)) drag = d; }
  if (d !== drag) { d.lastY = e.clientY; return; }
  if (d.moved && view.pan) {
    const du = (e.clientY - drag.lastY) / view.pxPerUnit, now = performance.now();
    view.camY = clamp(view.camY + du, view.yMin, view.yMax); view.goalY = null;
    view.camVY = du / Math.max(0.008, (now - drag.lastT) / 1000); drag.lastT = now;
  }
  drag.lastY = e.clientY;
});
canvas.addEventListener('pointerup', (e) => {
  const d = ptrs.get(e.pointerId); if (!d) return;
  ptrs.delete(e.pointerId);
  if (!d.moved) { if (drag === d) view.camVY = 0; handleTap(e.clientX, e.clientY); }
  else if (performance.now() - d.lastT > 90) view.camVY = 0;
  if (drag === d) drag = null;
});
canvas.addEventListener('pointercancel', (e) => { const d = ptrs.get(e.pointerId); ptrs.delete(e.pointerId); if (drag === d) drag = null; });
for (const ev of ['pointerdown', 'pointerup', 'touchend', 'click']) addEventListener(ev, unlockAudio, true);

function ripple(x, y) {
  const r = document.createElement('div'); r.className = 'ripple'; r.style.left = x + 'px'; r.style.top = y + 'px';
  document.getElementById('fx').appendChild(r); setTimeout(() => r.remove(), 600);
}

function handleTap(cx, cy) {
  if (G.phase !== 'play') return;
  ripple(cx, cy);
  const w = screenToWorld(cx, cy); if (!w) return;
  const L = G.layout;
  if (w.x < L.x0 - 0.5 || w.x > L.x1 + 0.5 || w.y < -0.5 || w.y > L.height + 0.5) return;
  const floor = clamp(Math.floor(w.y / ART.FLOOR_H), 0, L.nFloors - 1);
  let car = -1;
  for (let s = 0; s < L.nShafts; s++) if (Math.abs(w.x - L.shaftX[s]) < ART.SHAFT_W / 2) car = s;
  if (car < 0) car = w.x < L.x0 + ART.ROOM_W ? nearestCar(floor) : L.nShafts - 1;
  G.lastInputTime = G.time;
  tap(car, floor);
}

for (const el of [document.getElementById('home'), document.getElementById('hudR'), document.getElementById('hud')]) {
  for (const ev of ['pointerdown', 'pointerup', 'click', 'touchstart']) el.addEventListener(ev, (e) => e.stopPropagation(), { passive: true });
}

/* ======== hint & bot ======== */
function suggestMove() {
  if (G.phase !== 'play') return null;
  const free = G.cars.filter((c) => c.target == null && c.queuedTarget == null && (c.doorState === 'closed' || c.doorState === 'open'));
  for (const c of free) {
    const here = Math.round(c.y / ART.FLOOR_H);
    let best = -1, bd = Infinity;
    for (const p of c.riders) { const d = Math.abs(p.dest - here); if (p.dest !== carFloorAt(c) && d < bd) { bd = d; best = p.dest; } }
    if (best >= 0) return { car: c.idx, floor: best };
  }
  let worst = -1, wm = -1;
  G.floors.forEach((fl, f) => {
    if (!fl.queue.length) return;
    const claimed = G.cars.some((c) => c.target === f || c.queuedTarget === f || (carFloorAt(c) === f && c.seatsUsed < c.cap));
    if (claimed) return;
    const m = Math.max(...fl.queue.map((p) => p.waited / p.patience));
    if (m > wm) { wm = m; worst = f; }
  });
  if (worst < 0) return null;
  let car = -1, bd = Infinity;
  for (const c of free) { if (c.seatsUsed >= c.cap) continue; const d = Math.abs(c.y - worst * ART.FLOOR_H); if (d < bd) { bd = d; car = c.idx; } }
  return car >= 0 ? { car, floor: worst } : null;
}

const handEl = document.getElementById('hand');
function updateHint() {
  const delay = G.levelIdx === 0 ? HINT_DELAY_L1 : HINT_DELAY;
  const m = G.phase === 'play' && !(drag && drag.moved) && G.time - G.lastInputTime > delay ? suggestMove() : null;
  if (!m) { handEl.hidden = true; return; }
  const L = G.layout, s = worldToScreen(L.shaftX[m.car], m.floor * ART.FLOOR_H + 1.2, 0);
  if (s.y < view.ay + 10 || s.y > view.ay + view.ah - 30) { handEl.hidden = true; return; }
  handEl.hidden = false; handEl.style.left = s.x + 'px'; handEl.style.top = s.y + 'px';
}

/* ======== hud & screens ======== */
const PERSON_SVG = '<svg viewBox="0 0 12 16" aria-hidden="true"><circle cx="6" cy="3.6" r="3"/><path d="M1.5 16v-5a4.5 4.5 0 0 1 9 0v5z"/></svg>';
let progMode = '';
function renderProgress(bump) {
  const t = G.level.target, d = Math.min(G.delivered, t);
  const hud = document.getElementById('hud'), icons = document.getElementById('progIcons'), bar = document.getElementById('progBar');
  const avail = innerWidth - 64 - 114 - 64;
  const mode = !view.side && t * 16 + 16 <= avail ? 'icons' : 'bar';
  if (mode !== progMode || icons.children.length !== t) {
    progMode = mode; icons.hidden = mode !== 'icons'; bar.hidden = mode !== 'bar';
    icons.innerHTML = mode === 'icons' ? Array.from({ length: t }, () => '<span class="pi">' + PERSON_SVG + '</span>').join('') : '';
  }
  [...icons.children].forEach((el, i) => el.classList.toggle('on', i < d));
  hud.style.setProperty('--p', String(d / t));
  document.getElementById('progText').textContent = d + '/' + t;
  document.documentElement.dataset.delivered = String(G.delivered);
}

function updateStairs(bump) {
  const el = document.getElementById('stairs');
  el.hidden = G.leftStairs <= 0;
  document.getElementById('stairsN').textContent = String(G.leftStairs);
  if (bump) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
}

const edgeUp = document.getElementById('edgeUp'), edgeDown = document.getElementById('edgeDown');
function updateEdges() {
  let up = -1, down = -1, upF = -1, downF = -1;
  if (G.phase === 'play' && view.pan) {
    const lo = view.camY - view.visH / 2, hi = view.camY + view.visH / 2;
    G.floors.forEach((fl, f) => {
      if (!fl.queue.length) return;
      const cy = f * ART.FLOOR_H + 1.5, st = Math.max(...fl.queue.map((p) => Math.min(3, p.stage)));
      if (cy > hi - 0.6) { if (st > up || upF < 0) { up = st; upF = f; } }
      else if (cy < lo + 0.6) { if (st > down || downF < 0) { down = st; downF = f; } }
    });
  }
  const place = (el, stage, f, top) => {
    el.hidden = f < 0; if (f < 0) return;
    el.querySelector('span').textContent = MOOD_FACES[stage];
    el.classList.toggle('angry', stage >= 3); el.dataset.floor = String(f);
    el.style.left = (view.ax + view.aw / 2) + 'px';
    el.style.top = (top ? view.ay + 8 : view.ay + view.ah - 60) + 'px';
  };
  place(edgeUp, up, upF, true); place(edgeDown, down, downF, false);
}
for (const el of [edgeUp, edgeDown]) {
  el.addEventListener('pointerdown', (e) => e.stopPropagation());
  el.addEventListener('click', () => { const f = +el.dataset.floor; view.goalY = clamp(f * ART.FLOOR_H + 1.5, view.yMin, view.yMax); G.lastInputTime = G.time; });
}

function highestUnlocked() {
  const s = loadStars(); let u = 0;
  for (let i = 0; i < LEVELS.length; i++) if (s[i + 1]) u = Math.min(LEVELS.length - 1, i + 1);
  return u;
}

function renderMap() {
  const s = loadStars(), u = highestUnlocked(), box = document.getElementById('levels');
  box.innerHTML = '';
  LEVELS.forEach((_, i) => {
    const b = document.createElement('button'); b.className = 'lv' + (i > u ? ' locked' : '');
    b.style.gridRow = String(5 - Math.floor(i / 2)); b.style.gridColumn = String(1 + (i % 2));
    const n = s[i + 1] || 0;
    b.innerHTML = i > u ? '🔒' : (i + 1) + '<small>' + [0, 1, 2].map((k) => k < n ? '<i>★</i>' : '☆').join('') + '</small>';
    b.setAttribute('aria-label', 'Level ' + (i + 1));
    if (i <= u) b.addEventListener('click', () => startLevel(i)); else b.disabled = true;
    box.appendChild(b);
  });
}

const starTimers = [];
function showMap() {
  G.resumable = G.phase === 'play';
  G.phase = 'map';
  document.getElementById('win').hidden = true;
  document.getElementById('map').hidden = false;
  document.getElementById('mapBtn').hidden = true;
  renderMap();
}
document.getElementById('mapBtn').addEventListener('click', () => { if (G.phase !== 'map') showMap(); });
document.getElementById('play').addEventListener('click', () => {
  if (G.resumable) { G.resumable = false; G.phase = 'play'; document.getElementById('map').hidden = true; document.getElementById('mapBtn').hidden = false; document.getElementById('hud').hidden = false; }
  else startLevel(highestUnlocked());
});

function showWinCard() {
  G.cardShown = true;
  const win = document.getElementById('win'); win.hidden = false;
  const stars = [...document.querySelectorAll('.star')];
  stars.forEach((el, i) => { el.className = 'star' + (i < G.stars ? ' on' : ''); el.style.animationDelay = (0.25 + i * 0.35) + 's'; void el.offsetWidth; el.classList.add('show'); });
  for (let i = 0; i < G.stars; i++) starTimers.push(setTimeout(() => sfx('star', i), 250 + i * 350));
  document.getElementById('bNext').hidden = G.levelIdx >= LEVELS.length - 1;
  sfx('fanfare'); speak('Hooray!');
  const fx = document.getElementById('fx');
  const cols = FLOOR_THEMES.map((t) => t.color).concat(['#FFC93C', '#ffffff']);
  for (let k = 0; k < 40; k++) {
    const c = document.createElement('div'); c.className = 'conf';
    c.style.left = (rng() * 100) + '%'; c.style.background = cols[k % cols.length];
    c.style.animationDelay = (rng() * 0.8) + 's'; c.style.animationDuration = (2.2 + rng() * 1.2) + 's';
    fx.appendChild(c); setTimeout(() => c.remove(), 4500);
  }
}
document.getElementById('bReplay').addEventListener('click', () => startLevel(G.levelIdx));
document.getElementById('bNext').addEventListener('click', () => startLevel(G.levelIdx + 1));
document.getElementById('bMap').addEventListener('click', showMap);

/* ======== sound ======== */
const SND = { ctx: null, master: null, motor: null, motorGain: null, noise: null, lastSpeak: -9 };
let muted = FORCE_MUTE || loadKey('muted') === '1';

function unlockAudio() {
  if (FORCE_MUTE || muted) return;
  if (!SND.ctx) {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    try { SND.ctx = new AC(); } catch { return; }
    const c = SND.ctx;
    SND.master = c.createGain(); SND.master.gain.value = 0.6; SND.master.connect(c.destination);
    SND.motor = c.createOscillator(); SND.motor.type = 'sawtooth'; SND.motor.frequency.value = 55;
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 180;
    SND.motorGain = c.createGain(); SND.motorGain.gain.value = 0;
    SND.motor.connect(lp).connect(SND.motorGain).connect(SND.master); SND.motor.start();
    const len = c.sampleRate; SND.noise = c.createBuffer(1, len, c.sampleRate);
    const d = SND.noise.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  if (SND.ctx.state !== 'running' && !document.hidden) SND.ctx.resume().catch(() => {});
}
// hidden tab: suspend audio, silence the motor hum and speech; resume on return
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (SND.motorGain) SND.motorGain.gain.value = 0;
    if (SND.ctx) SND.ctx.suspend().catch(() => {});
    if (!FORCE_MUTE) try { window.speechSynthesis && speechSynthesis.cancel(); } catch {}
  } else if (SND.ctx && !muted && !FORCE_MUTE) SND.ctx.resume().catch(() => {});
});

function tone(f0, t0, dur, type = 'sine', vol = 0.3, f1) {
  const c = SND.ctx, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t0); if (f1) o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(SND.master); o.start(t0); o.stop(t0 + dur + 0.05);
  return o;
}
function noise(t0, dur, fa, fb, vol = 0.2, type = 'bandpass') {
  const c = SND.ctx, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  s.buffer = SND.noise; f.type = type; f.Q.value = 1.2; f.frequency.setValueAtTime(fa, t0); f.frequency.exponentialRampToValueAtTime(fb, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + dur * 0.3); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  s.connect(f).connect(g).connect(SND.master); s.start(t0); s.stop(t0 + dur + 0.05);
}

function sfx(name, arg) {
  if (FORCE_MUTE || muted || !SND.ctx || SND.ctx.state !== 'running') return;
  const t = SND.ctx.currentTime;
  switch (name) {
    case 'ding': tone(1046, t, 0.7, 'sine', 0.25); tone(784, t + 0.22, 0.9, 'sine', 0.25); break;
    case 'doorOpen': noise(t, 0.4, 600, 1800, 0.08); break;
    case 'doorClose': noise(t, 0.4, 1800, 600, 0.08); break;
    case 'chirp': [660, 880, 1175].forEach((f, i) => tone(f, t + i * 0.08, 0.14, 'triangle', 0.2)); break;
    case 'grumble': { const o = tone(110, t, 0.55, 'sawtooth', 0.12, 80); const l = SND.ctx.createOscillator(), lg = SND.ctx.createGain();
      l.frequency.value = 11; lg.gain.value = 18; l.connect(lg).connect(o.frequency); l.start(t); l.stop(t + 0.6); break; }
    case 'stomp': tone(90, t, 0.18, 'sine', 0.4, 40); tone(90, t + 0.22, 0.18, 'sine', 0.4, 40); tone(320, t + 0.45, 0.35, 'sawtooth', 0.04, 200); break;
    case 'full': tone(200, t, 0.22, 'sine', 0.3, 140); break;
    case 'tap': tone(1500, t, 0.04, 'square', 0.05); break;
    case 'fanfare': [523, 659, 784, 1046].forEach((f, i) => tone(f, t + i * 0.13, i === 3 ? 0.7 : 0.18, 'triangle', 0.22)); break;
    case 'star': tone(1318 + (arg || 0) * 220, t, 0.35, 'sine', 0.2); break;
  }
}

function updateMotor() {
  if (!SND.motorGain) return;
  const v = G.phase === 'map' || muted ? 0 : Math.max(0, ...G.cars.map((c) => Math.abs(c.v))) / CAR_SPEED;
  SND.motorGain.gain.setTargetAtTime(v * 0.08, SND.ctx.currentTime, 0.08);
  SND.motor.frequency.setTargetAtTime(50 + v * 25, SND.ctx.currentTime, 0.1);
}

function speak(text) {
  if (FORCE_MUTE || muted) return;
  const ss = window.speechSynthesis; if (!ss || typeof SpeechSynthesisUtterance === 'undefined') return;
  const now = performance.now() / 1000; if (now - SND.lastSpeak < 1.5) return; SND.lastSpeak = now;
  try {
    const u = new SpeechSynthesisUtterance(text); u.lang = 'en-GB'; u.rate = 1; u.pitch = 1.2;
    const v = ss.getVoices().find((x) => x.lang === 'en-GB') || ss.getVoices().find((x) => /^en/.test(x.lang)); if (v) u.voice = v;
    ss.speak(u);
  } catch {}
}

const muteBtn = document.getElementById('muteBtn');
function showMute() { muteBtn.textContent = muted ? '🔇' : '🔊'; }
muteBtn.addEventListener('click', () => {
  if (FORCE_MUTE) return;
  muted = !muted; saveKey('muted', muted ? '1' : '0'); showMute();
  if (muted) { if (SND.ctx) SND.ctx.suspend().catch(() => {}); try { window.speechSynthesis && speechSynthesis.cancel(); } catch {} }
  else unlockAudio();
});

/* ======== persistence ======== */
function loadKey(k) { try { return localStorage.getItem('goingup.' + k); } catch { return null; } }
function saveKey(k, v) { try { localStorage.setItem('goingup.' + k, v); } catch {} }
function loadStars() { try { return JSON.parse(loadKey('stars') || '{}') || {}; } catch { return {}; } }
function saveStars(i, n) { const s = loadStars(); if ((s[i + 1] || 0) < n) { s[i + 1] = n; saveKey('stars', JSON.stringify(s)); } }

/* ======== test hooks ======== */
window.__game = { G, LEVELS, FLOOR_THEMES, view, tap, suggestMove, startLevel,
  win() { if (G.phase === 'play') { G.delivered = G.level.target; renderProgress(); checkWin(); } },
  step(sec) { const n = Math.round(sec / FIXED_DT); for (let i = 0; i < n; i++) simStep(FIXED_DT); } };

/* ======== main loop ======== */
function syncVisuals() {
  const L = G.layout;
  for (const c of G.cars) {
    c.art.group.position.set(L.shaftX[c.idx], c.y, ART.CAR_Z);
    building.shafts[c.idx].setCarY(c.y);
    const e = c.door * c.door * (3 - 2 * c.door); c.art.setDoors(e);
    const t = c.target ?? c.queuedTarget ?? null; if (t !== c.shownTarget) { c.shownTarget = t; c.art.setTarget(t); }
    const dir = Math.sign(c.v); if (dir !== c.shownDir) { c.shownDir = dir; c.art.setMoving(dir); }
  }
  for (const p of G.people) {
    if (p.state !== 'riding') { p.art.group.position.set(p.x, L.floorY[p.floor], p.z); p.art.group.rotation.y = p.rot; }
    p.art.setAnim(p.anim, p.animT);
    const k = (view.bubbleK || 1) * (p.state === 'riding' || p.state === 'boarding' ? RIDER_BUBBLE : 1);
    if (k !== p.shownK) { p.shownK = k; p.art.setBubbleScale(k); }
    if (p.alpha !== p.shownAlpha) { p.shownAlpha = p.alpha; p.art.setOpacity(p.alpha); }
  }
  G.floors.forEach((f, i) => {
    const fh = building.floors[i];
    if (f.stairOpen !== f.shownStair) { f.shownStair = f.stairOpen; fh.setStairDoor(f.stairOpen); }
    if (f.roomOpen !== f.shownRoom) { f.shownRoom = f.roomOpen; fh.setRoomDoor(f.roomOpen); }
    const g = G.glow[i] > 0; if (g !== f.shownGlow) { f.shownGlow = g; fh.setGlow(g); }
  });
}

let last = performance.now(), lastSim = last, acc = 0, artTime = 0, frameCount = 0;
function advanceSim(now, maxDt) {
  const dt = Math.min(maxDt, Math.max(0, (now - lastSim) / 1000)); lastSim = now;
  if (G.phase !== 'play' && G.phase !== 'won') return;
  acc += dt * SPEED; let n = 0;
  while (acc >= FIXED_DT && n < 2000) { simStep(FIXED_DT); acc -= FIXED_DT; n++; }
  if (n >= 2000) acc = 0;
}
// ?demo also ticks from a timer, so headless runs (where animation frames are rare) still play and draw
if (TICK) setInterval(() => tick(performance.now(), 0.5), 100);
function frame(now) {
  requestAnimationFrame(frame);
  tick(performance.now(), 0.1);
}
function tick(now, maxDt) {
  const dt = Math.min(maxDt, Math.max(0, (now - last) / 1000)); last = now;
  advanceSim(now, maxDt);
  updateCameraMotion(dt); applyCamera();
  syncVisuals();
  artTime += dt; sky.update(artTime); animateArt(artTime, dt);
  updateHint(); updateEdges(); updateMotor();
  document.documentElement.dataset.phase = G.phase;
  if (TICK) document.documentElement.dataset.dbg = innerWidth + 'x' + innerHeight + ' f=' + (++frameCount) + ' t=' + G.time.toFixed(1) + ' people=' + G.people.length + ' ' + G.people.map((p) => p.state[0]).join('');
  renderer.render(scene, camera);
}

addEventListener('resize', fitCamera);
addEventListener('orientationchange', () => setTimeout(fitCamera, 200));
showMute();
const lvParam = parseInt(params.get('level'), 10);
if (Number.isFinite(lvParam)) startLevel(lvParam - 1);
else { setupLevel(highestUnlocked()); showMap(); }
requestAnimationFrame(frame);
</script>

if ('serviceWorker' in navigator) {
